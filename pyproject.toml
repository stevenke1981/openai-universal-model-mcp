[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-universal-model-mcp"
version = "0.1.2"
description = "Dynamic OpenAI Platform model discovery and multimodal MCP server with agent-first skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenAI Universal Model MCP Contributors" }]
dependencies = [
  "mcp[cli]>=2.0.0,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<10.0.0",
  "pytest-asyncio>=0.25.0,<2.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
